apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack
  namespace: lorawan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirpstack
  template:
    metadata:
      labels:
        app: chirpstack
    spec:
      containers:
        - name: chirpstack
          image: docker.io/chirpstack/chirpstack:4.11.0
          args: ["-c", "/etc/chirpstack"]
          volumeMounts:
            - name: config
              mountPath: /etc/chirpstack
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        - name: chirpstack-rest-api
          image: docker.io/chirpstack/chirpstack-rest-api:4.11.0
          args: ["--server", "127.0.0.1:8080", "--bind", "0.0.0.0:8090", "--insecure"]
          ports:
            - name: rest-api
              containerPort: 8090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: chirpstack-config
---
apiVersion: v1
kind: Service
metadata:
  name: chirpstack
  namespace: lorawan
spec:
  selector:
    app: chirpstack
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: rest-api
      port: 8090
      targetPort: 8090
