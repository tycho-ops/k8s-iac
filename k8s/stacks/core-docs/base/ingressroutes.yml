apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: doc-quatrain-community-web
  namespace: docs
  labels:
    app.kubernetes.io/name: core-docs
    app.kubernetes.io/part-of: quatrain-community
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`doc.quatrain.community`) || Host(`docs.quatrain.community`)) && PathPrefix(`/core`)
      kind: Rule
      priority: 100
      services:
        - name: core-docs
          port: 80
    - match: (Host(`doc.quatrain.community`) || Host(`docs.quatrain.community`)) && Path(`/`)
      kind: Rule
      priority: 50
      services:
        - name: core-docs
          port: 80
  tls:
    secretName: doc-quatrain-community-tls
---
