apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: git
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: git-qtrn-io
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/part-of: git-qtrn-io
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:9
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            # Server Configuration
            - name: FORGEJO__server__APP_DATA_PATH
              value: "/data"
            - name: FORGEJO__server__DOMAIN
              value: "git.qtrn.io"
            - name: FORGEJO__server__ROOT_URL
              value: "https://git.qtrn.io/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            # Embedded SQLite3 (Persistent on Scaleway SBS Block Storage)
            - name: FORGEJO__database__DB_TYPE
              value: "sqlite3"
            - name: FORGEJO__database__PATH
              value: "/data/gitea/forgejo.db"
            # Sovereign Security Settings
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            # Mirroring Protocol (GitHub -> git.qtrn.io)
            - name: FORGEJO__mirror__ENABLED
              value: "true"
            - name: FORGEJO__mirror__DEFAULT_INTERVAL
              value: "10m"
            - name: FORGEJO__repository__DEFAULT_BRANCH
              value: "main"
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc
